<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="Viewport" content="width=device width, initial scale=1.0" />
    <title>SiTA</title>
  </head>
  <body>
    <h1>SiTA - Simple Typing Assistant</h1>
    <p>
      Chrome:
      <script>
        document.write(process.versions.chrome);
      </script>
    </p>
    <p>
      Architektur:
      <script>
        document.write(process.arch);
      </script>
    </p>
    <p>
      Speicher:
      <script>
        document.write(process.getSystemMemoryInfo().free);
      </script>
    </p>
  </body>
</html>
